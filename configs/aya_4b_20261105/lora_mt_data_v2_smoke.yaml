model_name_or_path: ${MODEL}
stage: sft
do_train: true
finetuning_type: lora
template: qwen3
enable_thinking: false
train_on_prompt: false
mask_history: false
dataset_dir: ${DATA}/mixture-v2-translation
cutoff_len: 2048
packing: false
num_train_epochs: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.05
optim: adamw_torch
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
save_strategy: 'no'
save_only_model: true
overwrite_output_dir: false
report_to: none
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
logging_steps: 1
preprocessing_num_workers: 1
dataloader_num_workers: 0
accelerator_config:
  use_seedable_sampler: true
weight_decay: 0.0
max_grad_norm: 1.0
flash_attn: sdpa
ddp_find_unused_parameters: false
dataset: train6400
tokenized_path: ${DATA}/mixture-v2-translation/train6400_tokenized
output_dir: ${CHECKPOINTS}/lora_mt_data_v2_smoke2
logging_dir: ${LOGS}/lora-mt-data-v2-smoke
save_steps: 100
max_steps: 2
