model_name_or_path: ${MODEL}
stage: sft
do_train: true
finetuning_type: full
template: qwen3
enable_thinking: false
train_on_prompt: false
mask_history: false
dataset_dir: ${DATA}/training-v1/bn
dataset: bn_sft
tokenized_path: ${DATA}/training-v1/bn/tokenized
cutoff_len: 2048
packing: false
num_train_epochs: 2.0
max_steps: -1
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.05
optim: adamw_torch
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
save_strategy: epoch
save_only_model: true
overwrite_output_dir: false
report_to: none
logging_steps: 5
preprocessing_num_workers: 1
dataloader_num_workers: 0
dataloader_drop_last: false
accelerator_config:
  use_seedable_sampler: true
weight_decay: 0.0
max_grad_norm: 1.0
flash_attn: sdpa
ddp_find_unused_parameters: false
output_dir: ${CHECKPOINTS}/mathoctopus_bn_full_2epochs_seed42_v1
logging_dir: ${LOGS}/mathoctopus_bn_full_2epochs_seed42_v1/tensorboard
deepspeed: ${ROOT}/configs/sft_v1/deepspeed_z3.json
full_determinism: true
