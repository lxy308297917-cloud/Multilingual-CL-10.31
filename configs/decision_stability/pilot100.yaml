# Keep original6400-sample epoch/400-step schedule; entrypoint stops at fixed100.
model_name_or_path: /local/checkpoints/SW_FFT_FINAL400
stage: sft
do_train: true
finetuning_type: full
template: qwen3
enable_thinking: false
train_on_prompt: false
mask_history: false
dataset_dir: /local/datasets/aya-ha-sft-v1
cutoff_len: 2048
packing: false
num_train_epochs: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-05
lr_scheduler_type: cosine
warmup_ratio: 0.05
optim: adamw_torch
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
save_strategy: steps
save_only_model: false
overwrite_output_dir: false
report_to: tensorboard
logging_steps: 5
preprocessing_num_workers: 1
dataloader_num_workers: 0
accelerator_config:
  use_seedable_sampler: true
weight_decay: 0.0
max_grad_norm: 1.0
flash_attn: sdpa
ddp_find_unused_parameters: false
dataset: train6400
tokenized_path: /local/datasets/aya-ha-sft-v1/train6400_tokenized
output_dir: /local/checkpoints/decision-stability/METHOD
logging_dir: /local/logs/decision-stability/METHOD
save_steps: 100
deepspeed: configs/sft_v1/deepspeed_z3.json
full_determinism: true
