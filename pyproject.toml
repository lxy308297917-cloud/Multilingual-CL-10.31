[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-align-research"
version = "0.1.0"
description = "Small S3-Align extensions for existing training/evaluation environments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
